# CONFIG_LOCATION_IP_FILE_PUBLISH_V1

server {
    listen 80;
    listen [::]:80;

    server_name 85.192.63.181;

    access_log /var/log/nginx/config-location-sub-access.log;
    error_log  /var/log/nginx/config-location-sub-error.log warn;

    error_page 418 = @config_location_ed;

    location ~ ^/sub/(?<pubkey>[A-Za-z0-9_-]+)\.txt$ {

        # ED request goes to Unix socket only.
        if ($arg_ed = 1) {
            return 418;
        }

        alias /var/www/config-location-sub/current/$pubkey.txt;

        default_type text/plain;
        charset utf-8;

        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location @config_location_ed {

        proxy_pass http://unix:/run/config-location-ed/ed.sock;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Original-URI $request_uri;

        proxy_buffering off;
        proxy_request_buffering off;

        add_header Cache-Control "no-store" always;
    }

    location / {
        return 404;
    }
}
